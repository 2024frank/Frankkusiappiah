<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="monospace" font-size="11">

  <!-- Background -->
  <rect width="900" height="480" fill="#1a1a2e"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="36" fill="#0f3460" rx="0"/>
  <text x="16" y="23" fill="#e2e8f0" font-size="14" font-weight="bold">Sensor Signal Conditioning — INA333 Instrumentation Amplifier</text>
  <text x="700" y="23" fill="#64748b" font-size="11">KiCad 7 · Rev 1.1</text>

  <!-- Grid dots -->
  <g fill="#2a2a4a" opacity="0.5">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#2a2a4a"/>
    </pattern>
    <rect x="0" y="36" width="900" height="444" fill="url(#grid)"/>
  </g>

  <!-- ===== POWER INPUT SECTION ===== -->
  <!-- J3 VIN connector -->
  <rect x="30" y="80" width="50" height="50" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="55" y="98" fill="#94a3b8" text-anchor="middle" font-size="9">J3</text>
  <text x="55" y="112" fill="#60a5fa" text-anchor="middle" font-size="10" font-weight="bold">VIN</text>
  <text x="55" y="124" fill="#64748b" text-anchor="middle" font-size="8">5V</text>
  <!-- Connector pins -->
  <line x1="80" y1="95" x2="110" y2="95" stroke="#f97316" stroke-width="2"/>
  <line x1="80" y1="115" x2="110" y2="115" stroke="#4ade80" stroke-width="2"/>

  <!-- U2 LDO MCP1700 -->
  <rect x="110" y="72" width="80" height="56" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5" rx="3"/>
  <text x="150" y="90" fill="#60a5fa" text-anchor="middle" font-size="9" font-weight="bold">U2</text>
  <text x="150" y="103" fill="#e2e8f0" text-anchor="middle" font-size="10" font-weight="bold">MCP1700</text>
  <text x="150" y="116" fill="#94a3b8" text-anchor="middle" font-size="8">-3302</text>
  <text x="150" y="123" fill="#64748b" text-anchor="middle" font-size="7">LDO 3.3V</text>
  <!-- LDO connections -->
  <line x1="190" y1="95" x2="240" y2="95" stroke="#f97316" stroke-width="2"/>
  <line x1="150" y1="128" x2="150" y2="145" stroke="#4ade80" stroke-width="1.5"/>

  <!-- C5 input cap -->
  <text x="205" y="89" fill="#94a3b8" text-anchor="middle" font-size="8">C5</text>
  <line x1="210" y1="95" x2="210" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="204" y1="107" x2="216" y2="107" stroke="#94a3b8" stroke-width="2"/>
  <line x1="204" y1="110" x2="216" y2="110" stroke="#94a3b8" stroke-width="2"/>
  <line x1="210" y1="110" x2="210" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="108" fill="#64748b" font-size="7">1u</text>

  <!-- +3V3 power rail -->
  <line x1="240" y1="60" x2="240" y2="95" stroke="#f97316" stroke-width="2"/>
  <line x1="240" y1="60" x2="600" y2="60" stroke="#f97316" stroke-width="2" stroke-dasharray="6,2"/>
  <circle cx="240" cy="95" r="3" fill="#f97316"/>
  <text x="260" y="57" fill="#f97316" font-size="10" font-weight="bold">+3V3</text>

  <!-- GND bus -->
  <line x1="50" y1="145" x2="700" y2="145" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="30" y="142" fill="#4ade80" font-size="10" font-weight="bold">GND</text>

  <!-- ===== INPUT SECTION ===== -->
  <!-- J1 Sensor connector -->
  <rect x="30" y="190" width="60" height="80" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="60" y="208" fill="#94a3b8" text-anchor="middle" font-size="9">J1</text>
  <text x="60" y="222" fill="#e2e8f0" text-anchor="middle" font-size="9">SENSOR</text>
  <text x="60" y="234" fill="#64748b" text-anchor="middle" font-size="8">IN</text>
  <!-- Sensor pins -->
  <line x1="90" y1="205" x2="130" y2="205" stroke="#a78bfa" stroke-width="2"/>
  <text x="100" y="200" fill="#a78bfa" font-size="8">IN+</text>
  <line x1="90" y1="225" x2="130" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="220" fill="#94a3b8" font-size="8">SHD</text>
  <line x1="90" y1="245" x2="130" y2="245" stroke="#fb7185" stroke-width="2"/>
  <text x="100" y="240" fill="#fb7185" font-size="8">IN-</text>

  <!-- R1 input filter + -->
  <rect x="130" y="196" width="40" height="18" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="150" y="208" fill="#e2e8f0" text-anchor="middle" font-size="9">R1 10k</text>
  <line x1="170" y1="205" x2="200" y2="205" stroke="#a78bfa" stroke-width="2"/>

  <!-- R2 input filter - -->
  <rect x="130" y="236" width="40" height="18" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="150" y="248" fill="#e2e8f0" text-anchor="middle" font-size="9">R2 10k</text>
  <line x1="170" y1="245" x2="200" y2="245" stroke="#fb7185" stroke-width="2"/>

  <!-- C1 input capacitor -->
  <line x1="200" y1="205" x2="200" y2="219" stroke="#a78bfa" stroke-width="2"/>
  <line x1="193" y1="219" x2="207" y2="219" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="193" y1="223" x2="207" y2="223" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="200" y1="223" x2="200" y2="231" stroke="#a78bfa" stroke-width="2"/>
  <line x1="200" y1="231" x2="200" y2="245" stroke="#fb7185" stroke-width="2"/>
  <text x="212" y="223" fill="#64748b" font-size="8">C1</text>
  <text x="212" y="232" fill="#64748b" font-size="7">100n</text>
  <text x="212" y="240" fill="#64748b" font-size="7">fc=159Hz</text>

  <!-- ===== INA333 ===== -->
  <rect x="240" y="170" width="140" height="120" fill="#1a2744" stroke="#60a5fa" stroke-width="2" rx="4"/>
  <text x="310" y="192" fill="#60a5fa" text-anchor="middle" font-size="11" font-weight="bold">U1</text>
  <text x="310" y="207" fill="#e2e8f0" text-anchor="middle" font-size="13" font-weight="bold">INA333</text>
  <text x="310" y="221" fill="#94a3b8" text-anchor="middle" font-size="9">AIDR</text>
  <text x="310" y="236" fill="#64748b" text-anchor="middle" font-size="8">Gain = 1 + 100k/Rg</text>
  <text x="310" y="249" fill="#fbbf24" text-anchor="middle" font-size="9" font-weight="bold">Rg=1k → ×101</text>
  <text x="310" y="263" fill="#64748b" text-anchor="middle" font-size="7">50nV/√Hz noise</text>
  <text x="310" y="277" fill="#64748b" text-anchor="middle" font-size="7">25µA quiescent</text>
  <!-- INA333 pins left -->
  <text x="245" y="200" fill="#94a3b8" font-size="7">RG1</text>
  <line x1="240" y1="200" x2="220" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="245" y="215" fill="#a78bfa" font-size="7">IN+</text>
  <line x1="240" y1="215" x2="200" y2="205" stroke="#a78bfa" stroke-width="2"/>
  <text x="245" y="232" fill="#fb7185" font-size="7">IN-</text>
  <line x1="240" y1="232" x2="200" y2="245" stroke="#fb7185" stroke-width="2"/>
  <text x="245" y="250" fill="#4ade80" font-size="7">GND</text>
  <line x1="240" y1="250" x2="240" y2="145" stroke="#4ade80" stroke-width="1.2"/>
  <!-- INA333 pins right -->
  <text x="360" y="200" fill="#94a3b8" font-size="7">RG2</text>
  <line x1="380" y1="200" x2="360" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="358" y="220" fill="#fbbf24" font-size="7">OUT</text>
  <line x1="380" y1="220" x2="420" y2="220" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="360" y="240" fill="#f97316" font-size="7">V+</text>
  <line x1="380" y1="240" x2="380" y2="60" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="380" cy="60" r="3" fill="#f97316"/>
  <text x="360" y="255" fill="#34d399" font-size="7">REF</text>
  <line x1="380" y1="255" x2="380" y2="280" stroke="#34d399" stroke-width="1.5"/>

  <!-- Rg gain resistor -->
  <rect x="208" y="182" width="32" height="14" fill="none" stroke="#fbbf24" stroke-width="1.5" rx="2"/>
  <text x="224" y="192" fill="#fbbf24" text-anchor="middle" font-size="8">Rg 1k</text>
  <line x1="208" y1="189" x2="220" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="240" y1="189" x2="228" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- C2 bypass cap -->
  <line x1="360" y1="60" x2="360" y2="72" stroke="#f97316" stroke-width="1.5"/>
  <line x1="353" y1="72" x2="367" y2="72" stroke="#f97316" stroke-width="2"/>
  <line x1="353" y1="76" x2="367" y2="76" stroke="#f97316" stroke-width="2"/>
  <line x1="360" y1="76" x2="360" y2="88" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="360" y1="88" x2="360" y2="145" stroke="#4ade80" stroke-width="1.2"/>
  <text x="370" y="74" fill="#64748b" font-size="7">C2</text>
  <text x="370" y="82" fill="#64748b" font-size="7">100n</text>

  <!-- C3 bulk -->
  <line x1="345" y1="60" x2="345" y2="72" stroke="#f97316" stroke-width="1.5"/>
  <line x1="338" y1="72" x2="352" y2="72" stroke="#f97316" stroke-width="2"/>
  <line x1="338" y1="76" x2="352" y2="76" stroke="#f97316" stroke-width="2"/>
  <line x1="345" y1="76" x2="345" y2="145" stroke="#4ade80" stroke-width="1.2"/>
  <text x="324" y="74" fill="#64748b" font-size="7">C3</text>
  <text x="324" y="82" fill="#64748b" font-size="7">10u</text>

  <!-- ===== REF3033 ===== -->
  <rect x="340" y="280" width="90" height="55" fill="#1e3a5f" stroke="#34d399" stroke-width="1.5" rx="3"/>
  <text x="385" y="298" fill="#34d399" text-anchor="middle" font-size="9" font-weight="bold">U3</text>
  <text x="385" y="311" fill="#e2e8f0" text-anchor="middle" font-size="9" font-weight="bold">REF3033</text>
  <text x="385" y="324" fill="#94a3b8" text-anchor="middle" font-size="8">3.3V REF</text>
  <text x="385" y="330" fill="#64748b" text-anchor="middle" font-size="7">±0.05% init</text>
  <line x1="340" y1="295" x2="320" y2="295" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="320" cy="295" r="2" fill="#f97316"/>
  <line x1="385" y1="335" x2="385" y2="345" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="430" y1="295" x2="380" y2="255" stroke="#34d399" stroke-width="2"/>
  <circle cx="380" cy="255" r="3" fill="#34d399"/>

  <!-- ===== OUTPUT FILTER ===== -->
  <!-- R3 output filter -->
  <rect x="420" y="211" width="45" height="18" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="442" y="223" fill="#e2e8f0" text-anchor="middle" font-size="9">R3 1k</text>
  <line x1="465" y1="220" x2="500" y2="220" stroke="#fbbf24" stroke-width="2"/>

  <!-- C4 output capacitor -->
  <line x1="500" y1="220" x2="500" y2="234" stroke="#fbbf24" stroke-width="2"/>
  <line x1="493" y1="234" x2="507" y2="234" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="493" y1="238" x2="507" y2="238" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="500" y1="238" x2="500" y2="248" stroke="#4ade80" stroke-width="1.5"/>
  <line x1="500" y1="248" x2="500" y2="145" stroke="#4ade80" stroke-width="1.2"/>
  <text x="511" y="234" fill="#64748b" font-size="8">C4</text>
  <text x="511" y="243" fill="#64748b" font-size="7">10u</text>
  <text x="511" y="251" fill="#64748b" font-size="7">fc=16Hz</text>

  <!-- Wire to J2 -->
  <line x1="500" y1="220" x2="570" y2="220" stroke="#fbbf24" stroke-width="2"/>

  <!-- J2 output -->
  <rect x="570" y="205" width="60" height="50" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="600" y="222" fill="#94a3b8" text-anchor="middle" font-size="9">J2</text>
  <text x="600" y="235" fill="#fbbf24" text-anchor="middle" font-size="9" font-weight="bold">OUT</text>
  <text x="600" y="248" fill="#64748b" text-anchor="middle" font-size="8">Signal</text>
  <line x1="570" y1="220" x2="540" y2="220" stroke="#fbbf24" stroke-width="2"/>

  <!-- ===== ANNOTATION BOXES ===== -->
  <!-- Input filter annotation -->
  <rect x="126" y="272" width="100" height="55" fill="#0f172a" stroke="#3b82f6" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="176" y="287" fill="#3b82f6" text-anchor="middle" font-size="8" font-weight="bold">Input Filter</text>
  <text x="176" y="300" fill="#94a3b8" text-anchor="middle" font-size="7">R=10kΩ, C=100nF</text>
  <text x="176" y="311" fill="#94a3b8" text-anchor="middle" font-size="7">fc = 159 Hz</text>
  <text x="176" y="322" fill="#94a3b8" text-anchor="middle" font-size="7">Rejects 60Hz noise</text>

  <!-- Output filter annotation -->
  <rect x="420" y="262" width="115" height="60" fill="#0f172a" stroke="#3b82f6" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="477" y="277" fill="#3b82f6" text-anchor="middle" font-size="8" font-weight="bold">Output Filter</text>
  <text x="477" y="290" fill="#94a3b8" text-anchor="middle" font-size="7">R=1kΩ, C=10µF</text>
  <text x="477" y="301" fill="#94a3b8" text-anchor="middle" font-size="7">fc = 15.9 Hz</text>
  <text x="477" y="312" fill="#94a3b8" text-anchor="middle" font-size="7">Integrates ripple</text>

  <!-- Ground plane annotation -->
  <rect x="30" y="368" width="860" height="52" fill="#0d2a1a" stroke="#4ade80" stroke-width="1" rx="3" opacity="0.7"/>
  <text x="45" y="386" fill="#4ade80" font-size="9" font-weight="bold">Ground Plane (In1.Cu — Layer 2 of 4-layer stack-up)</text>
  <text x="45" y="400" fill="#94a3b8" font-size="8">Solid copper pour · &lt;5 mΩ resistance across board · Eliminates common-mode ground error</text>
  <text x="45" y="414" fill="#64748b" font-size="7">Star point at J1/GND pin · Analog and digital grounds separated by ferrite bead on production version</text>

  <!-- Signal flow arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="95" y1="340" x2="165" y2="340" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="108" y="336" fill="#64748b" font-size="7">Sensor</text>
  <line x1="240" y1="340" x2="310" y2="340" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="253" y="336" fill="#64748b" font-size="7">Amplify</text>
  <line x1="400" y1="340" x2="458" y2="340" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="413" y="336" fill="#64748b" font-size="7">Filter</text>
  <line x1="556" y1="340" x2="605" y2="340" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="562" y="336" fill="#64748b" font-size="7">Output</text>

  <!-- Noise annotation -->
  <rect x="650" y="160" width="235" height="160" fill="#1a1a2e" stroke="#374151" stroke-width="1" rx="4"/>
  <text x="660" y="178" fill="#fbbf24" font-size="9" font-weight="bold">Design Notes</text>
  <text x="660" y="195" fill="#94a3b8" font-size="8">INA333 CMRR: 100dB typical</text>
  <text x="660" y="209" fill="#94a3b8" font-size="8">Rejects common-mode noise</text>
  <text x="660" y="228" fill="#94a3b8" font-size="8">Input filter R1/R2 must be matched</text>
  <text x="660" y="241" fill="#94a3b8" font-size="8">to 0.1% for best CMRR</text>
  <text x="660" y="260" fill="#94a3b8" font-size="8">REF pin bias: ties output midpoint</text>
  <text x="660" y="273" fill="#94a3b8" font-size="8">to 3.3V/2 = 1.65V for single supply</text>
  <text x="660" y="292" fill="#fbbf24" font-size="8">LTspice model: TI INA333.zip</text>
  <text x="660" y="305" fill="#fbbf24" font-size="8">Ngspice: .net file in /simulation</text>

</svg>
