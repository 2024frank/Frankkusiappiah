<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="monospace" font-size="11">

  <!-- Background -->
  <rect width="900" height="480" fill="#1a1a2e"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="36" fill="#1a3a1a" rx="0"/>
  <text x="16" y="23" fill="#e2e8f0" font-size="14" font-weight="bold">ESP32 Power Management — LiFePO4 Battery Monitor</text>
  <text x="700" y="23" fill="#64748b" font-size="11">KiCad 7 · Rev 1.0</text>

  <!-- ===== BATTERY INPUT ===== -->
  <!-- LiFePO4 cell symbol -->
  <rect x="20" y="120" width="55" height="100" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
  <text x="47" y="140" fill="#94a3b8" text-anchor="middle" font-size="8">J1</text>
  <text x="47" y="154" fill="#e2e8f0" text-anchor="middle" font-size="9" font-weight="bold">LiFePO4</text>
  <text x="47" y="167" fill="#fbbf24" text-anchor="middle" font-size="10">3.2V</text>
  <text x="47" y="180" fill="#64748b" text-anchor="middle" font-size="7">3.0V min</text>
  <text x="47" y="191" fill="#64748b" text-anchor="middle" font-size="7">3.65V max</text>
  <text x="47" y="202" fill="#4ade80" text-anchor="middle" font-size="8">■ BATT+</text>
  <text x="47" y="213" fill="#64748b" text-anchor="middle" font-size="8">■ GND</text>
  <!-- Battery output lines -->
  <line x1="75" y1="145" x2="110" y2="145" stroke="#f97316" stroke-width="2.5"/>
  <line x1="75" y1="210" x2="110" y2="210" stroke="#4ade80" stroke-width="1.5"/>

  <!-- GND bus -->
  <line x1="20" y1="325" x2="870" y2="325" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="22" y="320" fill="#4ade80" font-size="9" font-weight="bold">GND</text>
  <line x1="110" y1="210" x2="110" y2="325" stroke="#4ade80" stroke-width="1.5"/>

  <!-- VBAT bus -->
  <line x1="110" y1="145" x2="280" y2="145" stroke="#f97316" stroke-width="2.5"/>
  <text x="140" y="140" fill="#f97316" font-size="9" font-weight="bold">VBAT</text>

  <!-- TVS diode D1 -->
  <rect x="110" y="130" width="50" height="30" fill="none" stroke="#94a3b8" stroke-width="1.2" rx="2"/>
  <text x="135" y="142" fill="#94a3b8" text-anchor="middle" font-size="7">D1</text>
  <text x="135" y="153" fill="#e2e8f0" text-anchor="middle" font-size="7">SMBJ5.0A</text>
  <text x="135" y="162" fill="#64748b" text-anchor="middle" font-size="6">TVS</text>
  <line x1="135" y1="160" x2="135" y2="325" stroke="#4ade80" stroke-width="1"/>

  <!-- C1 bulk cap -->
  <line x1="180" y1="145" x2="180" y2="160" stroke="#f97316" stroke-width="2"/>
  <line x1="172" y1="160" x2="188" y2="160" stroke="#f97316" stroke-width="3"/>
  <line x1="172" y1="165" x2="188" y2="165" stroke="#f97316" stroke-width="3"/>
  <line x1="180" y1="165" x2="180" y2="178" stroke="#4ade80" stroke-width="2"/>
  <line x1="180" y1="178" x2="180" y2="325" stroke="#4ade80" stroke-width="1.5"/>
  <text x="192" y="160" fill="#94a3b8" font-size="7">C1</text>
  <text x="192" y="170" fill="#94a3b8" font-size="7">100µF</text>
  <text x="192" y="179" fill="#64748b" font-size="6">Bulk input</text>

  <!-- R1 gate pullup -->
  <text x="218" y="140" fill="#94a3b8" font-size="7">R1 100k</text>
  <rect x="205" y="135" width="48" height="14" fill="none" stroke="#94a3b8" stroke-width="1.2" rx="2"/>
  <line x1="205" y1="142" x2="200" y2="142" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="200" cy="145" r="3" fill="#f97316"/>
  <line x1="253" y1="142" x2="265" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="142" x2="265" y2="165" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===== Q1 MOSFET ===== -->
  <rect x="265" y="130" width="80" height="80" fill="#1e2744" stroke="#a78bfa" stroke-width="2" rx="3"/>
  <text x="305" y="150" fill="#a78bfa" text-anchor="middle" font-size="9" font-weight="bold">Q1</text>
  <text x="305" y="163" fill="#e2e8f0" text-anchor="middle" font-size="10" font-weight="bold">Si2307DS</text>
  <text x="305" y="176" fill="#94a3b8" text-anchor="middle" font-size="8">P-ch MOSFET</text>
  <text x="305" y="189" fill="#64748b" text-anchor="middle" font-size="7">Vgs(th)=-1V</text>
  <text x="305" y="201" fill="#64748b" text-anchor="middle" font-size="7">Rds(on)=0.1Ω</text>
  <!-- MOSFET connections -->
  <line x1="265" y1="165" x2="250" y2="165" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="244" y="162" fill="#a78bfa" font-size="7">G</text>
  <line x1="305" y1="130" x2="305" y2="115" stroke="#f97316" stroke-width="2.5"/>
  <text x="308" y="120" fill="#f97316" font-size="7">S</text>
  <line x1="305" y1="210" x2="305" y2="225" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="308" y="235" fill="#fbbf24" font-size="7">D</text>

  <!-- VBAT line to MOSFET source -->
  <line x1="280" y1="145" x2="305" y2="145" stroke="#f97316" stroke-width="2.5"/>
  <line x1="305" y1="115" x2="305" y2="145" stroke="#f97316" stroke-width="2.5"/>

  <!-- ESP32 gate control line -->
  <line x1="250" y1="165" x2="250" y2="260" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="215" y="258" fill="#a78bfa" font-size="8">GATE_CTRL</text>
  <text x="215" y="268" fill="#64748b" font-size="7">ESP32 GPIO</text>
  <text x="215" y="278" fill="#64748b" font-size="7">LOW=ON</text>
  <text x="215" y="288" fill="#64748b" font-size="7">HIGH=CUT</text>

  <!-- VBAT_SW line (after MOSFET) -->
  <line x1="305" y1="225" x2="305" y2="250" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="305" y1="250" x2="560" y2="250" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="380" y="245" fill="#fbbf24" font-size="9" font-weight="bold">VBAT_SW</text>

  <!-- ===== VOLTAGE DIVIDER ===== -->
  <rect x="390" y="70" width="105" height="130" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" rx="4" stroke-dasharray="5,2"/>
  <text x="442" y="87" fill="#3b82f6" text-anchor="middle" font-size="9" font-weight="bold">Voltage Divider</text>

  <!-- R2 top -->
  <line x1="442" y1="90" x2="442" y2="105" stroke="#fbbf24" stroke-width="2"/>
  <rect x="425" y="105" width="34" height="22" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="442" y="117" fill="#e2e8f0" text-anchor="middle" font-size="8">R2</text>
  <text x="442" y="126" fill="#fbbf24" text-anchor="middle" font-size="7">100k 1%</text>
  <line x1="442" y1="127" x2="442" y2="142" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ADC_VMEAS node -->
  <circle cx="442" cy="145" r="4" fill="#34d399"/>
  <text x="452" y="142" fill="#34d399" font-size="8" font-weight="bold">ADC_VMEAS</text>
  <text x="452" y="152" fill="#64748b" font-size="7">0 to 1.167V</text>
  <line x1="446" y1="145" x2="500" y2="145" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- R3 bottom -->
  <line x1="442" y1="147" x2="442" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="425" y="160" width="34" height="22" fill="none" stroke="#94a3b8" stroke-width="1.5" rx="2"/>
  <text x="442" y="172" fill="#e2e8f0" text-anchor="middle" font-size="8">R3</text>
  <text x="442" y="181" fill="#94a3b8" text-anchor="middle" font-size="7">47k 1%</text>
  <line x1="442" y1="182" x2="442" y2="195" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="442" y1="195" x2="442" y2="325" stroke="#4ade80" stroke-width="1.5"/>

  <!-- Divider connections to VBAT_SW bus -->
  <line x1="442" y1="90" x2="442" y2="250" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="442" cy="250" r="4" fill="#fbbf24"/>

  <!-- ===== AMS1117 LDO ===== -->
  <rect x="560" y="200" width="110" height="100" fill="#1e3a1e" stroke="#4ade80" stroke-width="2" rx="4"/>
  <text x="615" y="220" fill="#4ade80" text-anchor="middle" font-size="9" font-weight="bold">U1</text>
  <text x="615" y="234" fill="#e2e8f0" text-anchor="middle" font-size="11" font-weight="bold">AMS1117</text>
  <text x="615" y="247" fill="#94a3b8" text-anchor="middle" font-size="9">-3.3</text>
  <text x="615" y="261" fill="#64748b" text-anchor="middle" font-size="7">LDO 3.3V output</text>
  <text x="615" y="272" fill="#64748b" text-anchor="middle" font-size="7">1.3V dropout</text>
  <text x="615" y="283" fill="#fbbf24" text-anchor="middle" font-size="7">⚠ Use MCP1700</text>
  <text x="615" y="292" fill="#fbbf24" text-anchor="middle" font-size="7">for LiFePO4 (0.3V)</text>
  <!-- LDO connections -->
  <line x1="560" y1="250" x2="540" y2="250" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="540" y1="250" x2="305" y2="250" stroke="#fbbf24" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.3"/>
  <line x1="670" y1="250" x2="720" y2="250" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="615" y1="300" x2="615" y2="325" stroke="#4ade80" stroke-width="1.5"/>

  <!-- +3V3 rail -->
  <line x1="720" y1="250" x2="720" y2="80" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,2"/>
  <text x="730" y="90" fill="#60a5fa" font-size="9" font-weight="bold">+3V3</text>
  <text x="730" y="102" fill="#64748b" font-size="7">→ ESP32 VDD</text>

  <!-- C2 LDO input cap -->
  <line x1="560" y1="250" x2="546" y2="250" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="546" y1="244" x2="546" y2="258" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="542" y1="244" x2="542" y2="258" stroke="#fbbf24" stroke-width="2.5"/>
  <line x1="542" y1="251" x2="542" y2="325" stroke="#4ade80" stroke-width="1.5"/>
  <text x="524" y="248" fill="#64748b" font-size="7">C2</text>
  <text x="524" y="258" fill="#64748b" font-size="7">10µF</text>

  <!-- C3 LDO output cap -->
  <line x1="720" y1="250" x2="732" y2="250" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="732" y1="244" x2="732" y2="258" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="736" y1="244" x2="736" y2="258" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="736" y1="251" x2="736" y2="325" stroke="#4ade80" stroke-width="1.5"/>
  <text x="740" y="248" fill="#64748b" font-size="7">C3</text>
  <text x="740" y="258" fill="#64748b" font-size="7">10µF</text>
  <text x="740" y="268" fill="#64748b" font-size="6">ESR req'd</text>

  <!-- C4 decoupling -->
  <line x1="760" y1="250" x2="774" y2="250" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="774" y1="244" x2="774" y2="258" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="778" y1="244" x2="778" y2="258" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="778" y1="251" x2="778" y2="325" stroke="#4ade80" stroke-width="1.5"/>
  <text x="783" y="248" fill="#64748b" font-size="7">C4</text>
  <text x="783" y="258" fill="#64748b" font-size="7">100n</text>

  <!-- ===== J2 ESP32 Connector ===== -->
  <rect x="790" y="190" width="80" height="115" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
  <text x="830" y="208" fill="#94a3b8" text-anchor="middle" font-size="9" font-weight="bold">J2</text>
  <text x="830" y="222" fill="#e2e8f0" text-anchor="middle" font-size="9">ESP32</text>
  <text x="830" y="234" fill="#e2e8f0" text-anchor="middle" font-size="9">Connector</text>
  <line x1="790" y1="244" x2="720" y2="250" stroke="#60a5fa" stroke-width="2"/>
  <text x="795" y="243" fill="#60a5fa" font-size="7">3V3</text>
  <line x1="790" y1="258" x2="760" y2="325" stroke="#4ade80" stroke-width="1.5"/>
  <text x="795" y="257" fill="#4ade80" font-size="7">GND</text>
  <line x1="790" y1="272" x2="500" y2="145" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="795" y="271" fill="#34d399" font-size="7">ADC</text>
  <line x1="790" y1="290" x2="250" y2="262" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="795" y="289" fill="#a78bfa" font-size="7">GPIO</text>
  <text x="795" y="300" fill="#64748b" font-size="6">(GATE)</text>

  <!-- ===== ADC measurement box ===== -->
  <rect x="500" y="120" width="155" height="85" fill="#0f172a" stroke="#34d399" stroke-width="1" rx="3" stroke-dasharray="4,2"/>
  <text x="577" y="137" fill="#34d399" text-anchor="middle" font-size="8" font-weight="bold">ADC Voltage Table</text>
  <text x="510" y="151" fill="#94a3b8" font-size="7">VBAT     ADC pin</text>
  <text x="510" y="163" fill="#4ade80" font-size="7">3.65V  → 1.167V ✓</text>
  <text x="510" y="174" fill="#94a3b8" font-size="7">3.20V  → 1.023V</text>
  <text x="510" y="185" fill="#fbbf24" font-size="7">2.50V  → 0.799V ← CUTOFF</text>
  <text x="510" y="196" fill="#f87171" font-size="7">2.30V  → 0.735V ✗ NO LOAD</text>

  <!-- Hysteresis annotation -->
  <rect x="20" y="348" width="860" height="75" fill="#1a1a2e" stroke="#374151" stroke-width="1" rx="3"/>
  <text x="30" y="366" fill="#fbbf24" font-size="9" font-weight="bold">Hysteresis Logic (implemented in ESP32 firmware):</text>
  <text x="30" y="381" fill="#94a3b8" font-size="8">UVLO threshold: 2.50V (ADC = 0.799V) → GPIO HIGH → Q1 Gate HIGH → MOSFET OFF → Load disconnected</text>
  <text x="30" y="395" fill="#94a3b8" font-size="8">Restore threshold: 2.65V (ADC = 0.847V) → GPIO LOW → Q1 Gate LOW → MOSFET ON → Load reconnected</text>
  <text x="30" y="409" fill="#64748b" font-size="7">Deadband = 0.048V on ADC (150mV on battery) · Prevents relay chattering at threshold voltage · LiFePO4 recovery takes 10-60 seconds</text>

</svg>
